version: '3.8'

services:
  backend:
    build: ./backend
    container_name: videosquash-backend
    ports:
      - "8000:8000"
    volumes:
      - backend-uploads:/app/uploads
      - backend-processed:/app/processed
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: videosquash-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-uploads:
  backend-processed:
